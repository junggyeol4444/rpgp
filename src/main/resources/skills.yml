# 지시서 8장 [skills.yml] / 기획서 6장
#
# 지시서 6장: 이 파일 외에 skills/ 디렉터리의 .yml 도 함께 읽힌다.
# 파일이 갈려도 스킬 id 는 서버 전체에서 하나뿐이어야 한다.
#
# ================================================================
# [밸런스 미확정]
# 아래 수치는 지시서 8장 예시값을 그대로 늘려 쓴 골격이다.
# 실제로 맞춰 본 값이 아니다. 조정 대상:
#   cost.mana / cooldown.seconds / power.base / power.scaling.coefficient
#   power.statScaling / effects 의 range · angle · ratio
#
# [이름 미확정]
# 기획서 TBD 1번(직업 이름과 세계관)이 정해지기 전이라 id 는 역할 기준,
# display 는 동작을 그대로 적은 임시 이름이다. 코드는 id 만 참조하므로
# display 만 바꾸면 된다.
#
# [효과 타입 부족]
# 지금 구현된 효과 타입은 DAMAGE_CONE / DAMAGE_TARGET / DAMAGE_AREA /
# HEAL_SELF 네 가지뿐이다. 펫 소환(tamer)과 설치물(trapper)은 해당 효과
# 타입이 아직 없어서, 위력이 나가는 자리만 잡아 두고 있는 상태다.
# 펫·설치 효과 타입이 생기면 그 직업의 effects 를 바꿔야 한다.
# ================================================================
