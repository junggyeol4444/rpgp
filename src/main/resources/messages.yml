# 지시서 6장: 모든 출력 문구는 이 파일에 둔다. 코드에 문구를 박지 않는다.
#
# 치환자는 {이름} 형식이다.
#
# [확인 필요 - 지시서 16장] 색 코드('&' 변환 또는 Adventure 컴포넌트)
# 처리 방식은 26.x에서 어떤 API가 유효한지 확인한 뒤 붙인다.
# 확인 전까지 문구에 색 코드를 쓰지 않는다. (지시서 0장 5번)
#
# 지금 들어 있는 문구는 1단계에서 실제로 쓰이는 것뿐이다.
# 스탯·직업·스킬·퀘스트 문구는 해당 단계에서 추가한다.

prefix: "[RpgCore] "

common:
  player-only: "이 명령은 플레이어만 사용할 수 있습니다."
  no-permission: "권한이 없습니다."
  unknown-subcommand: "알 수 없는 하위 명령입니다: {input}"
