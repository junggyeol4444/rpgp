  admin:
    desc: "관리자 명령"
    reload:
      desc: "설정 리로드"
    save:
      desc: "저장 강제 실행"
    status:
      desc: "플러그인 상태·버전 확인"
    debug:
      desc: "디버그 모드 토글"
    setlevel:
