      skill: " 스킬: {skill}"
      hint: " 좌클릭 바꾸기 / 우클릭 비우기"
    result:
      ok: ""
      unknown-skill: "그런 스킬이 없습니다."
      not-unlocked: "해금하지 않은 스킬입니다."
      slot-out-of-range: "열려 있지 않은 슬롯입니다."
      combo-taken: "이미 쓰이고 있는 조합입니다."
