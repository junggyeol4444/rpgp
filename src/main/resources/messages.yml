      not-enough-points: " 스킬 포인트가 모자랍니다."
      max-level: " 레벨 상한입니다."
      on-cooldown: "아직 쿨타임입니다."
      not-enough-mana: "마나가 모자랍니다."
      no-effect: "효과가 없습니다."
      invalid-amount: "값이 올바르지 않습니다."
  bind:
    empty: "비어 있음"
    no-skills: "해금한 스킬이 없습니다."
    info:
      name: "스킬 등록"
      slots: " 아이템 슬롯: {count}칸"
      combos: " 키 조합: {used} / {max}"
      hint: " 좌클릭 바꾸기 / 우클릭 비우기"
    slot:
      name: "{index}번 슬롯: {skill}"
      hint: " 좌클릭 바꾸기 / 우클릭 비우기"
    combo:
