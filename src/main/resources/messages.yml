      desc: "퀘스트 진행 이력 초기화"
    questcycle:
      desc: "일일·주간 퀘스트 리셋"

level:
  up: "레벨 업! {before} -> {after}"
  exp-gain: "경험치 +{amount}"
  max-reached: "최대 레벨에 도달했습니다."

admin:
  reload:
