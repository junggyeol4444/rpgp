    exp:
      desc: "경험치 지급·차감"
    datadump:
      desc: "플레이어 데이터 조회"
    datareset:
      desc: "플레이어 데이터 전체 초기화"
    statpoint:
      desc: "스탯 포인트 지급·회수"
    statreset:
      desc: "스탯 강제 초기화"
    setjob:
      desc: "직업 강제 지정"
    jobreset:
      desc: "전직 상태 초기화"
    skillpoint:
      desc: "스킬 포인트 지급·회수"
    skill:
      desc: "스킬 강제 해금·삭제"
    bindreset:
      desc: "스킬 바인딩 초기화"
    quest:
      desc: "퀘스트 부여·완료·취소"
