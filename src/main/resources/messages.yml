    remove: "{player}의 스킬 {skill} 을(를) 지웠습니다."
    failed: "처리하지 못했습니다: {skill}"
  bindreset:
    done: "{player}의 스킬 바인딩을 초기화했습니다."
  quest:
    give: "{player}에게 퀘스트 {quest} 을(를) 주었습니다."
    complete: "{player}의 퀘스트 {quest} 을(를) 완료 처리했습니다."
    cancel: "{player}의 퀘스트 {quest} 을(를) 취소했습니다."
  questreset:
    done: "{player}의 퀘스트 이력을 초기화했습니다."
  questcycle:
    done: "{type} 퀘스트를 리셋했습니다. (대상 {players}명, {count}건)"

# 키 이름에 on/off 를 쓰지 않는다. YAML 1.1 에서 on/off/yes/no 는
# 문자열이 아니라 불리언으로 해석되어 경로가 state.true / state.false 가 된다.
state:
  enabled: "켜짐"
  disabled: "꺼짐"

# 2단계 추가 — 파생 수치 이름 (지시서 4장)
derived:
  physicalDamage: "물리 공격력"
  magicDamage: "마법 공격력"
  defense: "방어력"
  maxHealth: "최대 체력"
  maxMana: "최대 마나"
  critChance: "치명타 확률"
  critDamage: "치명타 배수"
  attackSpeed: "공격 속도"

# 2단계 추가 — 상시 표시 (지시서 10장)
hud:
  actionbar: "HP {hp}/{maxHp}   MP {mana}/{maxMana}"
  scoreboard:
    title: "RpgCore"
    level: "레벨 {level}"
    exp: "경험치 {exp}/{required}"
    exp-max: "경험치 {exp} (최대)"
  tab:
    header: "레벨 {level}"
    footer: ""

# 2단계 추가 — 스탯 분배 창 (지시서 13장)
gui:
  stat:
    info:
      name: "남은 스탯 포인트: {points}"
    derived: " {name}: {value}"
    entry:
      name: "{stat}: {points}"
      per-point: " 1포인트당 {name} +{value}"
      hint: "좌클릭 +1 / 시프트 좌클릭 +{shift}"
    reset:
      name: "스탯 초기화"
      cost: " 비용: {currency} {amount}"
      owned: " 보유: {amount}"
    result:
      ok: "적용했습니다."
      unknown-stat: "그런 능력치가 없습니다."
      invalid-amount: "값이 올바르지 않습니다."
      not-enough-points: "스탯 포인트가 모자랍니다."
      reset-not-allowed: "스탯 초기화가 막혀 있습니다."
      not-enough-currency: "초기화 비용이 모자랍니다."
      nothing-to-reset: "되돌릴 분배 내역이 없습니다."

# 3단계 추가 — 직업 선택 창 (지시서 13장)
  job:
    info:
      name: "직업"
      none: " 아직 고르지 않았습니다. ({level}레벨부터)"
