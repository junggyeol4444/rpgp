# 지시서 6장: 모든 출력 문구는 이 파일에 둔다. 코드에 문구를 박지 않는다.
#
# 치환자는 {이름} 형식이다.
#
# [확인 필요 - 지시서 16장] 색 코드('&' 변환 또는 Adventure 컴포넌트)
# 처리 방식은 26.x에서 어떤 API가 유효한지 확인한 뒤 붙인다.
# 확인 전까지 문구에 색 코드를 쓰지 않는다. (지시서 0장 5번)
#
# 지금 들어 있는 문구는 1단계에서 실제로 쓰이는 것뿐이다.
# 스탯·직업·스킬·퀘스트 문구는 해당 단계에서 추가한다.

prefix: "[RpgCore] "

common:
  player-only: "이 명령은 플레이어만 사용할 수 있습니다."
  no-permission: "권한이 없습니다."
  unknown-subcommand: "알 수 없는 하위 명령입니다: {input}"
  unknown-player: "접속 중인 플레이어를 찾을 수 없습니다: {name}"
  data-not-loaded: "데이터를 아직 불러오지 못했습니다. 잠시 후 다시 시도하세요."
  invalid-number: "숫자가 아닙니다: {input}"
  usage: "사용법: {usage}"

help:
  header: "=== RpgCore 명령어 ==="
  line: " {usage} - {desc}"

command:
  info:
    desc: "현재 상태 요약"
    header: "=== {player} ==="
    level: " 전투 레벨: {level}"
    exp: " 경험치: {exp} / {required}"
    exp-max: " 경험치: {exp} (최대 레벨)"
    stat-points: " 남은 스탯 포인트: {points}"
  stat:
    desc: "스탯 분배"
    no-stats: "stats.yml 에 능력치 정의가 없습니다. 콘솔 로그를 확인하세요."
  admin:
    desc: "관리자 명령"
    reload:
      desc: "설정 리로드"
    save:
      desc: "저장 강제 실행"
    status:
      desc: "플러그인 상태·버전 확인"
    debug:
      desc: "디버그 모드 토글"
    setlevel:
      desc: "전투 레벨 설정"
    exp:
      desc: "경험치 지급·차감"
    datadump:
      desc: "플레이어 데이터 조회"
    datareset:
      desc: "플레이어 데이터 전체 초기화"
    statpoint:
      desc: "스탯 포인트 지급·회수"
    statreset:
      desc: "스탯 강제 초기화"

level:
  up: "레벨 업! {before} -> {after}"
  exp-gain: "경험치 +{amount}"
  max-reached: "최대 레벨에 도달했습니다."

admin:
  reload:
    done: "설정을 다시 불러왔습니다. (파일 {count}개, {ms}ms)"
    has-errors: "설정 오류 {count}건을 건너뛰었습니다. 콘솔 로그를 확인하세요."
  save:
    done: "저장을 요청했습니다. (대상 {count}명)"
  status:
    header: "=== RpgCore 상태 ==="
    version: " 버전: {version}"
    storage: " 저장소: {type}"
    online: " 캐시된 플레이어: {cached}명"
    autosave: " 자동 저장 간격: {seconds}초"
    debug: " 디버그: {state}"
    config-errors: " 마지막 설정 오류: {count}건"
  debug:
    toggled: "디버그 모드: {state}"
  setlevel:
    done: "{player}의 전투 레벨을 {level}로 설정했습니다."
  exp:
    given: "{player}에게 경험치 {amount}를 지급했습니다."
    taken: "{player}의 경험치 {amount}를 차감했습니다."
  datadump:
    header: "=== {player} 데이터 ==="
    line: " {path}: {value}"
  datareset:
    done: "{player}의 데이터를 초기화했습니다."
  statpoint:
    given: "{player}에게 스탯 포인트 {amount}를 지급했습니다."
    taken: "{player}의 스탯 포인트 {amount}를 회수했습니다."
  statreset:
    done: "{player}의 스탯을 초기화했습니다. (비용 없음)"

# 키 이름에 on/off 를 쓰지 않는다. YAML 1.1 에서 on/off/yes/no 는
# 문자열이 아니라 불리언으로 해석되어 경로가 state.true / state.false 가 된다.
state:
  enabled: "켜짐"
  disabled: "꺼짐"

# 2단계 추가 — 파생 수치 이름 (지시서 4장)
derived:
  physicalDamage: "물리 공격력"
  magicDamage: "마법 공격력"
  defense: "방어력"
  maxHealth: "최대 체력"
  maxMana: "최대 마나"
  critChance: "치명타 확률"
  critDamage: "치명타 배수"
  attackSpeed: "공격 속도"

# 2단계 추가 — 상시 표시 (지시서 10장)
hud:
  actionbar: "HP {hp}/{maxHp}   MP {mana}/{maxMana}"
  scoreboard:
    title: "RpgCore"
    level: "레벨 {level}"
    exp: "경험치 {exp}/{required}"
    exp-max: "경험치 {exp} (최대)"
  tab:
    header: "레벨 {level}"
    footer: ""

# 2단계 추가 — 스탯 분배 창 (지시서 13장)
gui:
  stat:
    info:
      name: "남은 스탯 포인트: {points}"
    derived: " {name}: {value}"
    entry:
      name: "{stat}: {points}"
      per-point: " 1포인트당 {name} +{value}"
      hint: "좌클릭 +1 / 시프트 좌클릭 +{shift}"
    reset:
      name: "스탯 초기화"
      cost: " 비용: {currency} {amount}"
      owned: " 보유: {amount}"
    result:
      ok: "적용했습니다."
      unknown-stat: "그런 능력치가 없습니다."
      invalid-amount: "값이 올바르지 않습니다."
      not-enough-points: "스탯 포인트가 모자랍니다."
      reset-not-allowed: "스탯 초기화가 막혀 있습니다."
      not-enough-currency: "초기화 비용이 모자랍니다."
      nothing-to-reset: "되돌릴 분배 내역이 없습니다."
