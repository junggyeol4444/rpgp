    taken: "{player}의 스탯 포인트 {amount}를 회수했습니다."
  statreset:
    done: "{player}의 스탯을 초기화했습니다. (비용 없음)"
  setjob:
    done: "{player}의 직업을 {job}(으)로 지정했습니다."
    unknown-job: "jobs.yml 에 없는 직업입니다: {job}"
    tier-not-supported: "지금은 base 만 지정할 수 있습니다. 1차·2차 전직은 8·9단계입니다: {tier}"
  jobreset:
    done: "{player}의 전직 상태를 초기화했습니다."
  skillpoint:
    given: "{player}에게 스킬 포인트 {amount}를 지급했습니다."
    taken: "{player}의 스킬 포인트 {amount}를 회수했습니다."
  skill:
