    exp-max: " 경험치: {exp} (최대 레벨)"
    stat-points: " 남은 스탯 포인트: {points}"
    job: " 직업: {job}"
    job-none: " 직업: 미선택 ({level}레벨에 선택 가능)"
  stat:
    desc: "스탯 분배"
