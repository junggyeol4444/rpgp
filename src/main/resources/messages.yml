    entry:
      name: "{job}"
      current: "{job} (선택함)"
      role: " 역할: {role}"
      bonus: " 레벨당 {stat} +{value}"
      selected: " 지금 이 직업입니다."
      click: " 눌러서 고르기 (되돌릴 수 없음)"
    selected: "직업을 {job}(으)로 정했습니다."
    state:
      ok: " 고를 수 있습니다."
      no-jobs: "jobs.yml 에 직업 정의가 없습니다."
      unknown-job: "그런 직업이 없습니다."
      level-too-low: " 레벨이 모자랍니다."
      already-selected: " 이미 골랐고 되돌릴 수 없습니다."

  # 4단계 추가 — 스킬트리 창 / 스킬 등록 창 (지시서 13장)
  skill:
    info:
      name: "남은 스킬 포인트: {points}"
      hint: "좌클릭 해금·레벨 +1 / 시프트 좌클릭 +{shift}"
