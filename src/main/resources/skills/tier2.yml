# 2차 전직 스킬 (9단계)
#
# 지시서 6장의 디렉터리 스캔으로 skills.yml 과 함께 읽힌다.
# 스킬 id 는 직업_2차분기_이름 으로 짓는다.
#
# requireBranch 는 2차 분기 id 다. stage: TIER2 이므로 2차 전직 전에는
# 아예 잠겨 있고, 다른 2차 분기를 고른 사람도 해금할 수 없다.
#
# ================================================================
# [밸런스 미확정] 수치는 1차 스킬과 같은 골격을 한 단계 올린 것이다.
# 맞춰 본 값이 아니다.
#
# [효과 타입 부족] 펫(tamer)과 설치물(trapper)은 해당 효과 타입이 아직
# 없어서 위력이 나가는 자리만 잡아 둔 상태다.
# ================================================================
