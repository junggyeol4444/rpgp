# 1차 전직 스킬 (8단계)
#
# 지시서 6장의 디렉터리 스캔으로 skills.yml 과 함께 읽힌다.
# 스킬 id 는 서버 전체에서 하나뿐이어야 하므로 직업_분기_이름 으로 짓는다.
# (tamer 와 trapper 의 1차 분기에 support 가 둘 다 있어서 필요하다)
#
# requireBranch 가 붙은 스킬은 그 1차 분기를 고른 사람만 해금할 수 있다.
# stage: TIER1 이므로 1차 전직 전에는 아예 잠겨 있다.
#
# ================================================================
# [밸런스 미확정] 수치는 기본 직업 스킬과 같은 골격을 쓴다.
# 맞춰 본 값이 아니다.
#
# [효과 타입 부족] 펫(tamer)과 설치물(trapper)은 해당 효과 타입이 아직
# 없어서 위력이 나가는 자리만 잡아 둔 상태다.
# ================================================================
